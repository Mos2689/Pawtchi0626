<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "surface-tint": "#755700",
              "outline": "#6c7980",
              "on-primary-fixed-variant": "#604700",
              "surface-container-low": "#F8F9FA",
              "on-tertiary-container": "#625f36",
              "on-secondary-fixed-variant": "#972900",
              "background": "#FFFFFF",
              "primary-dim": "#D9D600",
              "on-tertiary": "#faf5c0",
              "primary": "#FFFC00",
              "inverse-on-surface": "#929fa6",
              "error": "#b02500",
              "error-dim": "#b92902",
              "on-error": "#ffefec",
              "tertiary-fixed-dim": "#f0eab6",
              "secondary-container": "#ffc4b3",
              "tertiary-fixed": "#fef8c3",
              "primary-fixed": "#FFFC00",
              "on-surface-variant": "#515d64",
              "inverse-surface": "#041015",
              "on-primary-fixed": "#000000",
              "tertiary-dim": "#54512a",
              "surface-dim": "#E9ECEF",
              "on-background": "#1A1C1E",
              "on-secondary": "#ffefeb",
              "on-tertiary-fixed-variant": "#6d6940",
              "secondary-dim": "#952800",
              "error-container": "#f95630",
              "surface": "#FFFFFF",
              "secondary-fixed": "#ffc4b3",
              "surface-container-highest": "#DEE2E6",
              "secondary": "#a83206",
              "on-error-container": "#520c00",
              "on-surface": "#1A1C1E",
              "on-secondary-container": "#862400",
              "tertiary": "#605d34",
              "surface-container-lowest": "#FFFFFF",
              "primary-fixed-dim": "#E6E300",
              "on-tertiary-fixed": "#4f4d26",
              "on-primary-container": "#000000",
              "surface-container-high": "#F1F3F5",
              "tertiary-container": "#fef8c3",
              "secondary-fixed-dim": "#ffb19a",
              "surface-container": "#F1F3F5",
              "primary-container": "#FFFC00",
              "on-secondary-fixed": "#651900",
              "outline-variant": "#CED4DA",
              "surface-variant": "#F8F9FA",
              "on-primary": "#000000",
              "surface-bright": "#FFFFFF",
              "inverse-primary": "#FFFC00"
            },
            fontFamily: {
              "headline": ["Plus Jakarta Sans"],
              "body": ["Plus Jakarta Sans"],
              "label": ["Plus Jakarta Sans"]
            },
            borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .pet-card-selected {
            box-shadow: 0 0 0 4px #FFFC00, 0 10px 30px -10px rgba(255, 252, 0, 0.4);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background font-body text-on-background min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="w-full top-0 sticky z-50 bg-white/80 backdrop-blur-md">
<div class="flex items-center justify-between px-6 py-4 w-full max-w-xl mx-auto">
<button class="hover:scale-95 transition-transform text-on-surface flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-['Plus_Jakarta_Sans'] font-bold tracking-tight text-[1.25rem] text-on-surface">
                Pet Journey
            </h1>
<div class="w-10"></div> <!-- Spacer for balance -->
</div>
</header>
<main class="flex-1 flex flex-col px-6 pt-8 pb-12 w-full max-w-xl mx-auto">
<!-- Progress Indicator -->
<div class="flex flex-col gap-2 mb-10">
<div class="flex justify-between items-center px-1">
<span class="text-on-surface-variant font-bold text-sm tracking-widest uppercase">Step 2 of 4</span>
<span class="text-on-surface font-extrabold text-sm uppercase">Species</span>
</div>
<div class="h-3 w-full bg-surface-container-high rounded-full overflow-hidden">
<div class="h-full bg-primary-container w-1/2 rounded-full"></div>
</div>
</div>
<!-- Headline -->
<section class="mb-10">
<h2 class="font-headline font-extrabold text-[2.25rem] leading-[1.1] tracking-tight text-on-surface mb-4">
                Who are we caring for today?
            </h2>
<p class="text-on-surface-variant text-lg leading-relaxed">
                Choose your companion to help us tailor their health journey.
            </p>
</section>
<!-- Species Selection -->
<div class="grid grid-cols-1 gap-6 mb-auto">
<!-- Dog Card (Selected) -->
<button class="relative group overflow-hidden bg-white border border-surface-container-highest rounded-2xl p-8 flex items-center justify-between pet-card-selected transition-all duration-300 active:scale-95">
<div class="text-left">
<span class="block text-3xl font-extrabold text-on-surface mb-1">Dog</span>
<span class="text-on-surface-variant font-medium">Canine friend</span>
</div>
<div class="relative">
<div class="absolute inset-0 bg-primary/20 blur-2xl rounded-full"></div>
<span class="material-symbols-outlined text-[5rem] text-on-surface relative z-10" data-icon="pets" style="font-variation-settings: 'FILL' 1;">pets</span>
</div>
<!-- Selection Indicator -->
<div class="absolute top-4 right-4 bg-primary p-1 rounded-full border-2 border-white">
<span class="material-symbols-outlined text-on-primary text-sm font-bold" data-icon="check">check</span>
</div>
</button>
<!-- Cat Card -->
<button class="relative group overflow-hidden bg-surface-container-low border border-surface-container-highest rounded-2xl p-8 flex items-center justify-between hover:border-primary/50 transition-all duration-300 active:scale-95">
<div class="text-left">
<span class="block text-3xl font-extrabold text-on-surface mb-1">Cat</span>
<span class="text-on-surface-variant font-medium">Feline friend</span>
</div>
<div class="relative">
<span class="material-symbols-outlined text-[5rem] text-outline-variant group-hover:text-primary transition-colors" data-icon="pets">pets</span>
</div>
</button>
</div>
<!-- Footer Action -->
<div class="mt-12">
<button class="w-full bg-primary text-on-primary font-extrabold text-lg py-5 rounded-full shadow-[0_12px_24px_-8px_rgba(255,252,0,0.5)] hover:scale-[1.02] active:scale-95 transition-all flex items-center justify-center gap-2">
                Continue
                <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
<!-- Contextual Note -->
<p class="text-center text-on-surface-variant text-sm mt-6 px-8">
                Don't worry, you can add more pets later in your profile settings.
            </p>
</div>
</main>
</body></html>
