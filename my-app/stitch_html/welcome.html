<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "surface-tint": "#755700",
              "outline": "#6c7980",
              "on-primary-fixed-variant": "#604700",
              "surface-container-low": "#F5F5F5",
              "on-tertiary-container": "#625f36",
              "on-secondary-fixed-variant": "#972900",
              "background": "#FFFFFF",
              "primary-dim": "#D9D600",
              "on-tertiary": "#faf5c0",
              "primary": "#FFFC00",
              "inverse-on-surface": "#929fa6",
              "error": "#b02500",
              "error-dim": "#b92902",
              "on-error": "#ffefec",
              "tertiary-fixed-dim": "#f0eab6",
              "secondary-container": "#ffc4b3",
              "tertiary-fixed": "#fef8c3",
              "primary-fixed": "#FFFC00",
              "on-surface-variant": "#515d64",
              "inverse-surface": "#041015",
              "on-primary-fixed": "#1C1C00",
              "tertiary-dim": "#54512a",
              "surface-dim": "#E0E0E0",
              "on-background": "#243036",
              "on-secondary": "#ffefeb",
              "on-tertiary-fixed-variant": "#6d6940",
              "secondary-dim": "#952800",
              "error-container": "#f95630",
              "surface": "#FFFFFF",
              "secondary-fixed": "#ffc4b3",
              "surface-container-highest": "#EEEEEE",
              "secondary": "#a83206",
              "on-error-container": "#520c00",
              "on-surface": "#243036",
              "on-secondary-container": "#862400",
              "tertiary": "#605d34",
              "surface-container-lowest": "#ffffff",
              "primary-fixed-dim": "#E6E300",
              "on-tertiary-fixed": "#4f4d26",
              "on-primary-container": "#2E2D00",
              "surface-container-high": "#F0F0F0",
              "tertiary-container": "#FFFBD1",
              "secondary-fixed-dim": "#ffb19a",
              "surface-container": "#F8F8F8",
              "primary-container": "#FFFC00",
              "on-secondary-fixed": "#651900",
              "outline-variant": "#D1D1D1",
              "surface-variant": "#EEEEEE",
              "on-primary": "#1C1C00",
              "surface-bright": "#FFFFFF",
              "inverse-primary": "#FFFC00"
            },
            fontFamily: {
              "headline": ["Plus Jakarta Sans"],
              "body": ["Plus Jakarta Sans"],
              "label": ["Plus Jakarta Sans"]
            },
            borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #FFFFFF; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col">
<!-- Top Navigation Anchor -->
<header class="w-full top-0 sticky z-50 px-6 py-6 flex justify-between items-center bg-white/80 backdrop-blur-md">
<div class="font-headline font-extrabold tracking-tight text-[1.75rem] text-on-surface">
            PawPulse
        </div>
<div class="flex items-center gap-2 bg-surface-container-low px-4 py-2 rounded-full border border-outline-variant/30 shadow-sm">
<span class="text-on-surface-variant font-bold text-sm">Step 1 of 4</span>
</div>
</header>
<main class="flex-grow flex flex-col items-center justify-center px-6 max-w-xl mx-auto w-full pb-20">
<!-- Hero Section -->
<div class="relative w-full aspect-square mb-12 flex items-center justify-center">
<!-- Subtle Decorative Blobs for contrast on white -->
<div class="absolute inset-0 bg-primary-container opacity-10 blur-[80px] rounded-full scale-110"></div>
<div class="absolute top-0 right-0 w-32 h-32 bg-secondary-container opacity-15 blur-[40px] rounded-full"></div>
<!-- Main Illustration Container -->
<div class="relative z-10 w-full h-full bg-surface-container-lowest rounded-xl shadow-[0_32px_64px_rgba(0,0,0,0.06)] border border-outline-variant/20 overflow-hidden flex items-center justify-center">
<img alt="Happy dog and cat playing together" class="w-full h-full object-cover transform scale-110 hover:scale-105 transition-transform duration-700" data-alt="3D illustration of a friendly happy dog and cat" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAkN5Rum1UhJY0GrQ-SI0XGTQFMypSMmRwvyQx9EowCEBo5w2TBHhq-gOflvJALEVst9HHN4AsmJheNLADTxpOVXJt359Y1xwbu6Wd7o86waH1kyzMoobybdFVb6esMPEgPLeh1L_GSXXTna9bcwrE9eOijmpfHHIwjMsUiWRkUgX55zgqmzYIjEC7RCDhvKP2dp2t12bsWR5hqRiOjBk9uhVrD99K7XIhVEYZHn7Rk5QvrdG8jRsKoKkRku9HxZL1g_T5wxv6UPi0"/>
<!-- Floating "Health Bubble" Signature Component -->
<div class="absolute top-6 right-6 bg-tertiary-container px-4 py-3 rounded-full flex items-center gap-2 shadow-xl scale-110 animate-bounce border border-tertiary/10">
<span class="material-symbols-outlined text-tertiary" style="font-variation-settings: 'FILL' 1;">favorite</span>
<span class="text-on-tertiary-container font-bold text-sm">+50 XP</span>
</div>
</div>
</div>
<!-- Typography & Content -->
<div class="text-center space-y-6">
<h1 class="font-headline font-extrabold text-[2.5rem] leading-[1.1] tracking-tight text-on-surface">
                Welcome to PawPulse!
            </h1>
<p class="font-body text-lg text-on-surface-variant leading-relaxed px-4">
                Let's make pet health a game. Join thousands of happy pets on their journey to wellness.
            </p>
</div>
<!-- CTA Section -->
<div class="w-full mt-12 space-y-4">
<button class="w-full bg-[#FFFC00] text-[#1C1C00] font-headline font-bold text-xl py-6 rounded-full shadow-[0_12px_24px_rgba(255,252,0,0.25)] hover:shadow-[0_8px_16px_rgba(255,252,0,0.3)] hover:-translate-y-0.5 active:translate-y-0.5 active:shadow-none transition-all duration-200 flex items-center justify-center gap-3">
                Get Started
                <span class="material-symbols-outlined">arrow_forward</span>
</button>
<button class="w-full text-on-surface font-bold py-4 hover:bg-surface-container-low rounded-full transition-colors">
                I already have an account
            </button>
</div>
</main>
<!-- Subtle Progress Indicator (Bottom Anchor) -->
<footer class="w-full p-8 flex flex-col items-center gap-6">
<div class="flex gap-3 items-center">
<!-- Active Step -->
<div class="h-2 w-12 bg-[#FFFC00] rounded-full transition-all shadow-sm"></div>
<!-- Inactive Steps -->
<div class="h-2 w-2 bg-surface-container-highest rounded-full"></div>
<div class="h-2 w-2 bg-surface-container-highest rounded-full"></div>
<div class="h-2 w-2 bg-surface-container-highest rounded-full"></div>
</div>
<p class="text-on-surface-variant/60 text-xs font-medium tracking-widest uppercase">
            The Radiant Companion Experience
        </p>
</footer>
<!-- Glassmorphism Floating Decoration for premium feel -->
<div class="fixed -bottom-20 -left-20 w-64 h-64 bg-secondary-container/10 blur-[100px] rounded-full pointer-events-none"></div>
<div class="fixed -top-20 -right-20 w-64 h-64 bg-primary-container/10 blur-[100px] rounded-full pointer-events-none"></div>
</body></html>
