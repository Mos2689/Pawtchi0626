<!DOCTYPE html>

<style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #FFFFFF;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        }

        body {
          min-height: max(884px, 100dvh);
        }

<body class="bg-background text-on-background min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="w-full top-0 sticky z-50 bg-white/80 backdrop-blur-md transition-all duration-200">
<div class="flex items-center justify-between px-6 py-4 w-full max-w-xl mx-auto">
<div class="flex items-center gap-4">
<button class="hover:scale-95 transition-transform text-on-surface flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-['Plus_Jakarta_Sans'] font-bold tracking-tight text-[1.75rem] text-on-surface">
                    Pet Journey
                </h1>
</div>
<div class="flex items-center gap-2">
<div class="bg-surface-container-high px-4 py-1.5 rounded-full">
<span class="text-on-surface-variant font-bold text-sm tracking-wide">Step 3 of 4</span>
</div>
</div>
</div>
</header>
<main class="flex-grow flex flex-col items-center px-6 pt-4 pb-32 max-w-xl mx-auto w-full">
<!-- Hero Section -->
<div class="w-full mb-10 text-center relative">
<div class="absolute -top-6 -right-4 w-24 h-24 bg-primary/10 rounded-full blur-3xl"></div>
<h2 class="text-[2.25rem] font-extrabold leading-tight text-on-surface tracking-tight mb-2">
                Tell us about your buddy.
            </h2>
<p class="text-on-surface-variant text-lg">We'll use these stats to calculate their daily needs.</p>
</div>
<!-- Form Container -->
<div class="w-full space-y-6">
<!-- Pet Name Input -->
<div class="space-y-2">
<label class="block text-sm font-bold text-on-surface-variant ml-4" for="pet_name">Pet Name</label>
<div class="relative group">
<input class="w-full h-16 bg-surface-container-lowest border border-outline-variant/30 rounded-2xl px-6 text-lg font-semibold text-on-surface placeholder:text-outline-variant custom-focus transition-all shadow-sm" id="pet_name" placeholder="e.g. Barnaby" type="text"/>
<div class="absolute right-5 top-1/2 -translate-y-1/2 text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="pets">pets</span>
</div>
</div>
</div>
<!-- Bento Grid for Age and Weight -->
<div class="grid grid-cols-2 gap-4">
<!-- Age Input -->
<div class="space-y-2">
<label class="block text-sm font-bold text-on-surface-variant ml-4" for="pet_age">Age (Years)</label>
<div class="relative">
<input class="w-full h-20 bg-surface-container-lowest border border-outline-variant/30 rounded-3xl px-6 text-2xl font-extrabold text-on-surface custom-focus transition-all shadow-sm text-center" id="pet_age" placeholder="2" type="number"/>
</div>
</div>
<!-- Weight Input -->
<div class="space-y-2">
<label class="block text-sm font-bold text-on-surface-variant ml-4" for="pet_weight">Weight (kg)</label>
<div class="relative">
<input class="w-full h-20 bg-surface-container-lowest border border-outline-variant/30 rounded-3xl px-6 text-2xl font-extrabold text-on-surface custom-focus transition-all shadow-sm text-center" id="pet_weight" placeholder="12.5" step="0.1" type="number"/>
</div>
</div>
</div>
<!-- Toggle Card -->
<div class="bg-surface-container-low border border-outline-variant/20 p-6 rounded-3xl flex items-center justify-between transition-transform hover:scale-[1.01]">
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-full bg-primary flex items-center justify-center text-on-primary-container">
<span class="material-symbols-outlined" data-icon="medical_services">medical_services</span>
</div>
<div>
<h3 class="font-bold text-on-surface">Desexed</h3>
<p class="text-xs text-on-surface-variant">Important for calorie tracking</p>
</div>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input class="sr-only peer" type="checkbox" value=""/>
<div class="w-14 h-8 bg-surface-container-highest peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[4px] after:start-[4px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-6 after:w-6 after:transition-all peer-checked:bg-primary"></div>
</label>
</div>
<!-- Decorative Visual -->
<div class="pt-4 flex justify-center">
<div class="relative group">
<div class="absolute inset-0 bg-primary blur-2xl opacity-10 group-hover:opacity-20 transition-opacity"></div>
<div class="relative bg-surface-container-lowest rounded-full p-4 shadow-md flex items-center gap-4 border border-outline-variant/20">
<img alt="Beagle puppy" class="w-14 h-14 rounded-full object-cover" data-alt="Close up of a happy beagle puppy face" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCuq9b2sfmCI1kyQij1fFOS-ExiC6u8sJZD3DBN263YLeYZa3tOEd_Ttiytu8h_YUUSqManvAdG2Yyr59dPXQp5A-SFuyavlu0edh5Rz7JYkIIRj7Dm0funkDftfbubZloxdmJkbF8bluV7tKrfqmgNvdTHvrg9LJoRudpkcphxtVZjYxW5R7EkSpAN1dIhiHuRi1yXsXIBMo9AZPWBgwQEDXnBd7lbwuwUM728q26RT195tXPPfflmzBaSBuD59EAaswv5BkYf71c"/>
<div class="pr-6">
<span class="text-xs font-bold text-on-surface tracking-widest uppercase">Quick Tip</span>
<p class="text-sm font-medium text-on-surface-variant">Active pups need more protein!</p>
</div>
</div>
</div>
</div>
</div>
<!-- Sticky Footer Action -->
<div class="fixed bottom-0 left-0 w-full px-6 pb-10 pt-6 bg-gradient-to-t from-white via-white/95 to-transparent">
<div class="max-w-xl mx-auto">
<button class="w-full bg-primary text-on-primary-fixed font-bold text-xl py-5 rounded-full shadow-lg hover:brightness-95 hover:scale-[0.98] active:scale-95 transition-all flex items-center justify-center gap-2">
                    Next
                    <span class="material-symbols-outlined" data-icon="chevron_right">chevron_right</span>
</button>
</div>
</div>
</main>
</body></html>
